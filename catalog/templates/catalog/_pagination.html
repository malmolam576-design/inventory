{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
  <a
    href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}"
    rel="prev"
    >&larr; Previous</a
  >
  {% else %}
  <span class="disabled" aria-hidden="true">&larr; Previous</span>
  {% endif %}
  <span class="current"
    >Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span
  >
  {% if page_obj.has_next %}
  <a
    href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}"
    rel="next"
    >Next &rarr;</a
  >
  {% else %}
  <span class="disabled" aria-hidden="true">Next &rarr;</span>
  {% endif %}
</nav>
{% endif %}
